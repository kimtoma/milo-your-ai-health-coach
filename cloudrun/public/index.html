<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f9ff">
  <meta name="description" content="주사와 체중, 오늘의 작은 이야기. 나의 속도에 맞춰 함께 남기는 건강 메이트 Milo.">
  <title>Milo — 나의 건강 메이트</title>
  <link rel="icon" href="/assets/milo-rounded.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;450;500;550;600;650;700;750;800&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <div id="app"><div class="boot"><img src="/assets/milo-rounded.png" alt="Milo" width="96" height="96"><p>나의 작은 기록을 준비하고 있어요.</p></div></div>
  <md-dialog id="record-dialog" aria-label="기록 남기기">
    <div slot="headline" id="record-headline"></div>
    <div slot="content" id="record-content"></div>
    <div slot="actions" id="record-actions"></div>
  </md-dialog>
  <md-dialog id="info-dialog" aria-label="상세 정보">
    <div slot="headline" id="info-headline"></div>
    <div slot="content" id="info-content"></div>
    <div slot="actions" id="info-actions"></div>
  </md-dialog>
  <div id="snackbar" class="snackbar" role="status" aria-live="polite" hidden></div>
  <noscript>Milo를 사용하려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
</body>
</html>
